<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ملف يارا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ece1c8;
    --paper-light: #f7f1e1;
    --paper-dark: #ddccA3;
    --ink: #362a1e;
    --ink-soft: #5c4a37;
    --red: #8a2020;
    --red-dark: #641414;
    --gold: #a3854f;
    --shadow: rgba(54, 42, 30, 0.28);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; min-height:100vh; background: var(--ink); font-family:'Markazi Text', serif; color: var(--ink); }
  body{
    background: radial-gradient(circle at 20% 10%, rgba(0,0,0,0.15), transparent 40%),
                radial-gradient(circle at 80% 90%, rgba(0,0,0,0.2), transparent 45%), #2a2018;
    display:flex; align-items:flex-start; justify-content:center;
    padding: 24px 12px 60px;
  }
  .stage{ width:100%; max-width:680px; }
  .card{
    background: radial-gradient(circle at 15% 15%, rgba(255,255,255,0.5), transparent 25%),
                radial-gradient(circle at 85% 90%, rgba(0,0,0,0.06), transparent 35%), var(--paper);
    border:1px solid var(--paper-dark);
    box-shadow: 0 18px 40px var(--shadow), inset 0 0 60px rgba(163,133,79,0.12);
    border-radius: 4px; padding: 36px 28px 30px; position:relative;
  }
  .card::before{ content:""; position:absolute; inset:10px; border:1px solid rgba(163,133,79,0.45); pointer-events:none; }
  h1{ font-family:'Aref Ruqaa', serif; font-size: 32px; margin: 0 0 6px; color: var(--ink); text-align:center; }
  .sub{ font-family:'Markazi Text', serif; color: var(--ink-soft); font-size: 19px; margin-bottom: 26px; text-align:center; }
  .eyebrow{
    font-family:'Aref Ruqaa', serif; font-size: 13px; letter-spacing: 3px; color: var(--red);
    display:block; text-align:center; margin-bottom: 4px;
  }
  .days-grid{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    margin-top: 10px;
  }
  .day-label{
    position: relative;
    background: var(--paper-light);
    border: 1px solid var(--paper-dark);
    border-radius: 3px;
    padding: 14px 4px 10px;
    text-align:center;
    cursor:pointer;
    font-family:'Aref Ruqaa', serif;
    color: var(--ink);
    box-shadow: 0 3px 8px rgba(54,42,30,0.15);
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .day-label:hover{ transform: translateY(-3px); box-shadow: 0 7px 14px rgba(54,42,30,0.25); background: #fff8e8; }
  .day-label .num{ display:block; font-size: 20px; color: var(--red-dark); }
  .day-label .tag{ display:block; font-size: 10px; letter-spacing: 1px; color: var(--ink-soft); margin-top: 2px; font-family:'Markazi Text',serif; }
  .day-label.opened::after{
    content: "";
    position: absolute; top: -4px; left: -4px;
    width: 10px; height: 10px;
    background: var(--red);
    border-radius: 50%;
    opacity: .8;
  }

  /* ---------- Modal ---------- */
  #modal-backdrop{
    position: fixed; inset:0;
    background: rgba(20,14,8,0.72);
    display:none;
    align-items:center; justify-content:center;
    z-index: 999;
    padding: 20px;
  }
  #modal-backdrop.show{ display:flex; }
  #modal-card{
    background: var(--paper);
    border: 1px solid var(--paper-dark);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border-radius: 4px;
    max-width: 480px;
    width:100%;
    max-height: 80vh;
    overflow-y:auto;
    padding: 30px 24px 26px;
    position:relative;
    animation: pop .25s ease both;
  }
  @keyframes pop{ from{ opacity:0; transform: scale(.94); } to{ opacity:1; transform: scale(1); } }
  #modal-card::before{ content:""; position:absolute; inset:8px; border:1px solid rgba(163,133,79,0.4); pointer-events:none; }
  #modal-day-title{ font-family:'Aref Ruqaa', serif; color: var(--red); font-size: 24px; text-align:center; margin: 0 0 16px; }
  #modal-day-text{ font-size: 20px; line-height: 2; color: var(--ink); white-space: pre-wrap; text-align:justify; }
  #modal-close{
    display:block; margin: 22px auto 0;
    font-family:'Aref Ruqaa', serif; font-size: 16px;
    background: var(--red); color: var(--paper-light);
    border:none; padding: 9px 24px; border-radius: 2px; cursor:pointer;
  }
  @media (max-width: 480px){
    .days-grid{ grid-template-columns: repeat(3, 1fr); }
    h1{ font-size: 26px; }
    .card{ padding: 26px 16px 22px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="card">
    <span class="eyebrow">ملف خاص</span>
    <h1>يارا</h1>
    <div class="days-grid" id="days-grid"></div>
  </div>
</div>

<div id="modal-backdrop">
  <div id="modal-card">
    <h2 id="modal-day-title"></h2>
    <div id="modal-day-text"></div>
    <button id="modal-close" onclick="closeModal()">إغلاق</button>
  </div>
</div>

const grid = document.getElementById('days-grid');
for(let i = 1; i <= 22; i++){
  const el = document.createElement('div');
  el.className = 'day-label';
  el.id = 'day-' + i;
  el.innerHTML = `<span class="num">${i}</span><span class="tag">اليوم</span>`;
  el.onclick = () => openDay(i);
  grid.appendChild(el);
}

function openDay(i){
  document.getElementById('modal-day-title').textContent = 'اليوم ' + i;
  document.getElementById('modal-day-text').textContent = DAYS[i] || '';
  document.getElementById('modal-backdrop').classList.add('show');
  document.getElementById('day-' + i).classList.add('opened');
}
function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('show');
}
document.getElementById('modal-backdrop').addEventListener('click', (e) => {
  if(e.target.id === 'modal-backdrop') closeModal();
});
</script>
