<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>  لعبه يارا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE1C6;
    --paper-dark: #E1CFA4;
    --paper-line: #C9B587;
    --ink: #221E17;
    --ink-soft: #5A4E3C;
    --stamp-red: #8C2E1F;
    --gold: #A97C2F;
    --faded-blue: #46617A;
    --locked: #9C927B;
    --shadow: rgba(34,30,23,0.32);
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(34,30,23,0.025) 0px, rgba(34,30,23,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at top left, #F1E5C7 0%, var(--paper) 55%, var(--paper-dark) 100%);
    font-family: 'Cairo', sans-serif;
    color: var(--ink);
    padding: 28px 14px 60px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .folder-tab{
    background: var(--ink);
    color: #E4D4A8;
    font-weight:900;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 6px 22px;
    border-radius: 3px 3px 0 0;
    transform: rotate(-1deg);
    box-shadow: 0 3px 6px var(--shadow);
    margin-bottom: -4px;
    z-index:2;
  }

  header{
    width:100%;
    max-width: 520px;
    background: var(--paper-dark);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 20px 22px 16px;
    box-shadow: 0 10px 24px var(--shadow);
    position:relative;
    margin-bottom: 10px;
  }
  header::after{
    content:"سري";
    position:absolute;
    top:14px; left:16px;
    font-size:11px;
    font-weight:900;
    letter-spacing:3px;
    color: var(--stamp-red);
    border: 2px solid var(--stamp-red);
    padding: 3px 8px;
    border-radius: 3px;
    transform: rotate(-8deg);
    opacity:0.85;
  }
  h1{
    font-size: 21px;
    font-weight: 900;
    margin: 0 0 4px;
  }
  .case-name{
    font-size: 14px;
    color: var(--ink-soft);
    font-weight:600;
  }
  .case-name b{ color: var(--stamp-red); }

  .restart-link{
    background:none;
    border:none;
    font-family:'Cairo',sans-serif;
    font-size:12px;
    font-weight:700;
    color: var(--locked);
    text-decoration: underline dotted;
    cursor:pointer;
    padding:0;
    margin-bottom: 22px;
  }
  .restart-link:hover{ color: var(--stamp-red); }

  .progress{
    display:flex;
    gap:8px;
    width:100%;
    max-width: 520px;
    margin-bottom: 22px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .dot{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:14px;
    border: 2px dashed var(--locked);
    color: var(--locked);
    background: transparent;
    transition: all .35s ease;
  }
  .dot.active{
    border-style: solid;
    border-color: var(--stamp-red);
    color: var(--stamp-red);
    background: rgba(140,46,31,0.08);
    transform: scale(1.12);
  }
  .dot.done{
    border-style: solid;
    border-color: var(--faded-blue);
    color: #F1E5C7;
    background: var(--faded-blue);
  }

  .stage{
    width:100%;
    max-width: 520px;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 26px 24px 22px;
    box-shadow: 0 14px 30px var(--shadow);
    position:relative;
    margin-bottom: 18px;
    animation: riseIn .5s ease both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(14px) rotate(-0.6deg); }
    to{ opacity:1; transform: translateY(0) rotate(0deg); }
  }
  .stage::before, .stage::after{
    content:"";
    position:absolute;
    width:60px; height:22px;
    background: rgba(241,229,199,0.55);
    border: 1px solid rgba(34,30,23,0.08);
    top:-10px;
  }
  .stage::before{ left:26px; transform: rotate(-6deg); }
  .stage::after{ right:26px; transform: rotate(5deg); }

  .stage-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:800;
    letter-spacing:1px;
    color: var(--gold);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .stage-type{
    background: rgba(70,97,122,0.12);
    color: var(--faded-blue);
    padding: 2px 10px;
    border-radius: 20px;
    font-size:11px;
    font-weight:800;
  }
  .clue{
    font-size:18px;
    font-weight:700;
    line-height:1.75;
    margin: 6px 0 18px;
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom: 6px;
  }
  .option-btn{
    text-align:right;
    font-family:'Cairo',sans-serif;
    font-size:15px;
    font-weight:700;
    padding: 13px 16px;
    border: 2px solid var(--paper-line);
    background: #F7F0DC;
    color: var(--ink);
    border-radius: 4px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .option-btn:hover{
    border-color: var(--faded-blue);
    background: rgba(70,97,122,0.06);
  }
  .option-btn:disabled{ cursor:default; opacity:0.6; }

  .answer-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  input[type="text"]{
    flex:1;
    min-width: 160px;
    font-family:'Cairo',sans-serif;
    font-size:16px;
    font-weight:600;
    padding: 12px 14px;
    border: 2px solid var(--paper-line);
    border-bottom: 2px solid var(--ink-soft);
    border-radius: 3px;
    background: #F7F0DC;
    color: var(--ink);
  }
  input[type="text"]:focus{ outline:none; border-color: var(--faded-blue); }

  .stamp-btn{
    font-family:'Cairo',sans-serif;
    font-weight:900;
    font-size:14px;
    background: transparent;
    color: var(--stamp-red);
    border: 3px solid var(--stamp-red);
    border-radius: 6px;
    padding: 10px 18px;
    cursor:pointer;
    letter-spacing:1px;
  }
  .stamp-btn:active{ transform: scale(0.94); }
  .stamp-btn:hover{ background: rgba(140,46,31,0.08); }

  .feedback{
    margin-top: 14px;
    font-weight:800;
    font-size:14px;
    min-height: 20px;
  }
  .feedback.wrong{ color: var(--stamp-red); animation: shake .35s ease; }
  .feedback.right{ color: var(--faded-blue); }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }

  .game-over-box{
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed var(--paper-line);
  }

  .approved-stamp{
    position:absolute;
    top: 18px; left: 20px;
    border: 3px solid var(--faded-blue);
    color: var(--faded-blue);
    font-weight:900;
    font-size:13px;
    letter-spacing:2px;
    padding: 4px 10px;
    border-radius:4px;
    transform: rotate(-10deg) scale(0);
    opacity:0;
    pointer-events:none;
  }
  .approved-stamp.show{
    animation: stampDown .5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampDown{
    0%{ transform: rotate(-10deg) scale(2.4); opacity:0; }
    60%{ opacity:1; }
    100%{ transform: rotate(-10deg) scale(1); opacity:1; }
  }

  .reveal{
    width:100%;
    max-width: 520px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 4px;
    padding: 34px 26px;
    text-align:center;
    box-shadow: 0 18px 40px var(--shadow);
    animation: riseIn .6s ease both;
  }
  .reveal h2{
    font-size: 23px;
    margin: 0 0 14px;
    color: #F1E5C7;
  }
  .reveal p{
    font-size:16px;
    line-height:1.85;
    color: #D9CBA8;
    margin-bottom: 20px;
  }
  .reveal a.reveal-btn{
    display:inline-block;
    background: var(--stamp-red);
    color: #F1E5C7;
    font-weight:800;
    text-decoration:none;
    padding: 12px 26px;
    border-radius: 6px;
    letter-spacing:0.5px;
    margin: 6px;
  }
  .code-box{
    display:inline-block;
    background: rgba(241,229,199,0.08);
    border: 2px dashed var(--paper-line);
    color: #F1E5C7;
    font-weight:900;
    font-size: 20px;
    letter-spacing: 3px;
    padding: 12px 24px;
    border-radius: 6px;
    margin-bottom: 18px;
  }

  footer{
    margin-top: 30px;
    font-size:11px;
    color: var(--locked);
    text-align:center;
  }
</style>
</head>
<body>

<div class="folder-tab">سري وشخصي</div>
<header>
  <h1> العبى يا يارا العبى</h1>
  <div class="case-name">الحالة الخاصة بـ: <b id="friendNameDisplay"></b></div>
</header>
<button class="restart-link" id="restartTop">إعادة الاختبار من البداية</button>

<div class="progress" id="progress"></div>
<div id="stagesRoot"></div>

<footer>خمسة أسئلة. إجابة واحدة غلط، وترجع تاني من الأول.</footer>

<script>
/* ======================================================================
   عدّل هنا بس — الأسئلة والإجابات والرسالة النهائية
   كل سؤال إما نوعه "mc" (اختيارات) أو "text" (يكتب إجابته بنفسه)
   في أسئلة الـ mc: حط correct: true على الاختيار الصح بس، والباقي false
   في أسئلة الـ text: أي إجابة غير فاضية بتتقبل تلقائي (مفيش إجابة "غلط")
   notifyPhone: رقم الواتساب اللي هيستقبل الإجابات في الآخر (بالكود الدولي من غير + أو صفر)
   ====================================================================== */
const CONFIG = {
  friendName: "يارا",
  notifyPhone: "201033707583",

  stages: [
    {
      type: "معضلة أخلاقية",
      qtype: "mc",
      clue: "إنت وصاحبك تايهين في نص الصحراء، وهو مصاب إصابة قاتلة ومش هيعيش. قدامك خيارين بس: يا تستناه لحد ما يموت من نفسه وتاكله عشان تقدر تكمل وتنجو لوحدك، يا تقعد تعالجه وتفضلوا مع بعض لحد ما تموتوا الاتنين من العطش والجوع. هتختار إيه؟",
      options: [
        { label: "أستناه يموت وآكله عشان أنجو لوحدي", correct: true },
        { label: "أعالجه ونموت احنا الاتنين مع بعض", correct: true }
      ]
    },
    {
      type: "سؤال وجودي",
      qtype: "mc",
      clue: "البني آدم في أساسه كائن فاسد؟",
      options: [
        { label: "اه جدا", correct: true },
        { label: "لا", correct: true }
      ]
    },
    {
      type: "سؤال حر",
      qtype: "text",
      clue: "فيلسوف واقف قدامك وقالك: العالم كله وهم، وحقيقة واحدة بس فيه صحيحة. إيه الحقيقة دي في رأيه؟ (اكتب كلمة أو جملة قصيرة)"
    },
    {
      type: "اختبار غريب",
      qtype: "text",
      clue: "لو تقدر تمسح ذكرى واحدة بس من دماغك للأبد وهي بجد هتتمسح، هتمسح إيه"
    },
    {
      type: "السؤال الأخير",
      qtype: "text",
      clue: "الموت واقف قدامك، وقالك هيسيبك تعيش بشرط واحد بس: تنسى شخص واحد من حياتك للأبد، كأنه ماكانش موجود خالص. هتختار تنسى مين؟"
    }
  ],

  finalReveal: {
    title: "التقييم اتقفل.",
    message: "هممم مقتنعه يا يارا؟",
    buttonText: "",
    buttonLink: ""
  },

  // الكود اللي هيظهرلها في الآخر، وهي هتبعتهولك عشان تثبت إنها خلصت
  completionCode: "654896511561"
};
/* ====================================================================== */

const state = { current: 0, answers: [] };

function normalize(s){
  return s.trim().toLowerCase().replace(/\s+/g,' ');
}

function buildWhatsAppLink(){
  const lines = [`الكود: ${CONFIG.completionCode}`, '', `إجابات ${CONFIG.friendName}:`, ''];
  state.answers.forEach((a, i) => {
    lines.push(`${i + 1}) ${a.type}`);
    lines.push(`الإجابة: ${a.answer}`);
    lines.push('');
  });
  const text = encodeURIComponent(lines.join('\n'));
  return `https://wa.me/${CONFIG.notifyPhone}?text=${text}`;
}

function renderProgress(){
  const el = document.getElementById('progress');
  const arabicDigits = ['١','٢','٣','٤','٥','٦','٧','٨','٩'];
  el.innerHTML = CONFIG.stages.map((_, i) => {
    let cls = 'dot';
    if (i < state.current) cls += ' done';
    else if (i === state.current) cls += ' active';
    return `<div class="${cls}">${i < state.current ? '+' : (arabicDigits[i] || i+1)}</div>`;
  }).join('');
}

function restartGame(){
  state.current = 0;
  state.answers = [];
  renderProgress();
  renderStage();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStage(){
  document.getElementById('friendNameDisplay').textContent = CONFIG.friendName;
  const root = document.getElementById('stagesRoot');

  if (state.current >= CONFIG.stages.length){
    root.innerHTML = renderReveal();
    return;
  }

  const s = CONFIG.stages[state.current];
  const bodyHtml = s.qtype === 'mc'
    ? `<div class="options" id="optionsWrap">
         ${s.options.map((o, idx) => `<button class="option-btn" data-idx="${idx}">${o.label}</button>`).join('')}
       </div>
       <div class="feedback" id="feedback"></div>`
    : `<div class="answer-row">
         <input type="text" id="answerInput" placeholder="اكتب إجابتك هنا" autocomplete="off">
         <button class="stamp-btn" id="submitBtn">تحقق</button>
       </div>
       <div class="feedback" id="feedback"></div>`;

  root.innerHTML = `
    <div class="stage">
      <div class="approved-stamp" id="stampEl">تم</div>
      <div class="stage-label">
        <span>سؤال ${state.current + 1} من ${CONFIG.stages.length}</span>
        <span class="stage-type">${s.type}</span>
      </div>
      <div class="clue">${s.clue}</div>
      ${bodyHtml}
    </div>
  `;

  if (s.qtype === 'mc'){
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        handleAnswer(s.options[idx].correct === true, null, s.options[idx].label, s.type);
      });
    });
  } else {
    const input = document.getElementById('answerInput');
    const submit = () => {
      const val = input.value.trim();
      handleAnswer(val !== '', input, val, s.type);
    };
    document.getElementById('submitBtn').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }
}

function handleAnswer(isCorrect, textInputEl, answerText, questionType){
  const feedback = document.getElementById('feedback');

  if (isCorrect){
    feedback.textContent = 'إجابة صحيحة.';
    feedback.className = 'feedback right';
    document.getElementById('stampEl').classList.add('show');
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    if (textInputEl){
      textInputEl.disabled = true;
      document.getElementById('submitBtn').disabled = true;
    }
    state.answers.push({ type: questionType, answer: answerText });
    setTimeout(() => {
      state.current++;
      renderProgress();
      renderStage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 850);
  } else {
    feedback.innerHTML = `إجابة غلط. لازم تجاوب صح على الخمسة أسئلة عشان تكمل.
      <div class="game-over-box"><button class="stamp-btn" id="restartBtn">إعادة الاختبار من البداية</button></div>`;
    feedback.className = 'feedback wrong';
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
    if (textInputEl){
      textInputEl.disabled = true;
      document.getElementById('submitBtn').disabled = true;
    }
    document.getElementById('restartBtn').addEventListener('click', restartGame);
  }
}

function renderReveal(){
  const r = CONFIG.finalReveal;
  const customBtn = (r.buttonText && r.buttonLink)
    ? `<a class="reveal-btn" href="${r.buttonLink}" target="_blank" rel="noopener">${r.buttonText}</a>`
    : '';
  return `
    <div class="reveal">
      <h2>${r.title}</h2>
      <p>${r.message}</p>
      <div class="code-box">${CONFIG.completionCode}</div>
      <a class="reveal-btn" href="${buildWhatsAppLink()}" target="_blank" rel="noopener">ابعتيلي الكود</a>
      ${customBtn}
    </div>
  `;
}

document.getElementById('restartTop').addEventListener('click', restartGame);

renderProgress();
renderStage();
</script>
</body>
</html>
